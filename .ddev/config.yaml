name: uzdoom-wasm
type: laravel
docroot: server/public
webserver_type: nginx-fpm
php_version: "8.3"
database:
  type: mariadb
  version: "11.8"
nodejs_version: "22"
web_extra_exposed_ports:
  - name: relay
    container_port: 8081
    http_port: 8082
    https_port: 8081
web_extra_daemons:
  - name: relay
    command: "node relay.js"
    directory: /var/www/html/relay
